name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin manifest
        run: claude plugin validate --strict .claude-plugin/plugin.json
      - name: Reject OS junk files
        run: |
          if git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini|__MACOSX)'; then
            echo "Remove the files above; the Claude directory blocks plugins that contain them." >&2
            exit 1
          fi
